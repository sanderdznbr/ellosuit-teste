    <script>
      // Intercept Google OAuth callbacks meant for our own integrations
      // (Google Calendar / Gmail) BEFORE the Supabase JS client loads.
      // Otherwise supabase-js `detectSessionInUrl` sees the `?code=` param
      // and tries to exchange it for a session, signing the user out and
      // logging them in as the connected Google account.
      //
      // We only stash params that pass strict validation:
      //   * `state` must be `<flow>.<nonce>` where flow is one of the
      //     known values and nonce is a 16+ char url-safe token.
      //   * A matching pending intent (with the same nonce) must exist
      //     in sessionStorage and be < 10 minutes old.
      //   * `code` must look like a Google auth code (url-safe chars,
      //     bounded length) and no `error` from Google.
      // Anything failing validation is discarded and the URL is cleaned,
      // so a stray/forged `?code=` cannot trigger a session swap either.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var state = params.get('state') || '';
          var code = params.get('code');
          var err = params.get('error');

          var KNOWN_FLOWS = ['google_calendar_auth', 'gmail_auth'];
          var stateMatch = /^([a-z_]+)\.([A-Za-z0-9_-]{16,128})$/.exec(state);
          var flow = stateMatch ? stateMatch[1] : null;
          var nonce = stateMatch ? stateMatch[2] : null;
          var knownFlow = flow && KNOWN_FLOWS.indexOf(flow) !== -1;

          var intent = null;
          try {
            var raw = sessionStorage.getItem('__ellosuit_oauth_intent__');
            if (raw) intent = JSON.parse(raw);
          } catch (_) { intent = null; }

          var MAX_AGE_MS = 10 * 60 * 1000;
          var intentValid = !!(
            intent &&
            knownFlow &&
            intent.flow === flow &&
            intent.nonce === nonce &&
            typeof intent.createdAt === 'number' &&
            (Date.now() - intent.createdAt) < MAX_AGE_MS
          );

          var codeValid = typeof code === 'string' &&
            code.length >= 20 && code.length <= 2048 &&
            /^[A-Za-z0-9/_\-.%]+$/.test(code);

          if (knownFlow && intentValid && (codeValid || err)) {
            sessionStorage.setItem(
              '__ellosuit_oauth_pending__',
              JSON.stringify({
                code: codeValid ? code : null,
                state: state,
                flow: flow,
                nonce: nonce,
                userId: intent.userId || null,
                error: err || null,
                receivedAt: Date.now()
              })
            );
          } else if (knownFlow || code || err) {
            // Wrong/expired/forged callback — drop it and log.
            console.warn('OAuth callback rejected', {
              knownFlow: knownFlow,
              intentValid: intentValid,
              codeValid: codeValid,
              hasError: !!err
            });
          }

          // Always strip OAuth params from the URL so supabase-js cannot
          // pick them up, regardless of whether they were accepted.
          if (code || err || state) {
            params.delete('code');
            params.delete('state');
            params.delete('error');
            params.delete('scope');
            params.delete('authuser');
            params.delete('prompt');
            params.delete('hd');
            var qs = params.toString();
            var newUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
            window.history.replaceState({}, document.title, newUrl);
          }
        } catch (e) {
          console.warn('OAuth intercept failed', e);
        }
      })();
    </script>
